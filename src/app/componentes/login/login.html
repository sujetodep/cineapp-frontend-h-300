<form [formGroup]="form">
    <h1>Iniciar sesión</h1>
    <label>Cuenta de correo
        <input type="text" formControlName="correo" placeholder="Ingrese su cuenta de correo">
    </label>
    <label>Contraseña
        <input type="password" formControlName="contrasenia" placeholder="Ingrese su contraseña">
    </label>

    <a [routerLink]="['/usuario/crear']" class="text-white px-2">Crear cuenta de usuario</a>

    <input type="button" [disabled]="!form.valid" (click)="login()" value="Login">
</form>
