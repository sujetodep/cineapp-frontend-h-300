<section class="mt-5">
    <div id="galeria" class="row g-4 justify-content-center galeria">
        <ng-content *ngFor="let pelicula of listService.peliculas">
            <div class="col-md-3 col-sm-6 categoria-{{pelicula.genero}}">
                <div class="card bg-dark text-white h-100">
                    <img src="assets/images/movies/{{pelicula.portada}}" alt="{{pelicula.titulo}}" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{pelicula.titulo}}</h5>
                        <div>
                            <a [routerLink]="['/pelicula/detalle', pelicula._id]" class="btn btn-danger">Ver
                                detalles</a>
                            &nbsp;
                            <a *ngIf="sessionService.usuario.rol === 'admin'"
                                [routerLink]="['/pelicula/actualizar', pelicula._id]"
                                class="btn btn-danger">Modificar</a>
                        </div>
                        <div>
                            &nbsp;Horarios&nbsp;
                        </div>
                        <div>
                            <ng-content *ngFor="let cartelera of listService.carteleras">
                                <ng-content *ngIf="cartelera.pelicula === pelicula._id">
                                    <ng-content *ngFor="let sala of listService.salas">
                                        <ng-content *ngIf="cartelera.sala === sala._id">
                                            <div class="sala">
                                                {{sala.nombre}}
                                                &nbsp;
                                                <a *ngIf="sessionService.usuario.rol === 'admin'"
                                                    [routerLink]="['/cartelera/actualizar', cartelera._id]"
                                                    class="btn btn-danger">Modificar cartetelera</a>
                                            </div>
                                            <div class="dias">
                                                <ng-content
                                                    *ngFor="let dia of listService.listProyecciones(cartelera.proyecciones)">
                                                    <div class="item">{{dia}}</div>
                                                </ng-content>
                                            </div>
                                            <div class="horas">
                                                <ng-content *ngFor="let hora of listService.listHorarios(cartelera.horario)">
                                                    <div class="item">{{hora}}</div>
                                                </ng-content>
                                            </div>
                                        </ng-content>
                                    </ng-content>
                                </ng-content>
                            </ng-content>
                        </div>
                    </div>
                </div>
            </div>
        </ng-content>
    </div>
</section>
